  <text x="24" y="672" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">错误内联显示并自动聚焦；提交失败时服务端 fieldErrors 回填到对应字段</text>
  <text x="24" y="690" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">26 个字段全部非受控注册，输入长文本不再触发整表单重渲染</text>
