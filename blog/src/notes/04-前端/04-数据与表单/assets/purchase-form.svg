  <text x="316" y="250" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#1f2937">生产一部</text>

  <text x="44" y="288" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#475569">到货日期 <tspan fill="#dc2626">*</tspan></text>
  <rect x="44" y="296" width="240" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="56" y="316" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#1f2937">2026-12-05</text>

