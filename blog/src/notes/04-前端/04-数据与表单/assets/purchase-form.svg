  <text x="364" y="561" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#1f2937">4</text>
  <rect x="478" y="544" width="96" height="26" rx="5" fill="#fef2f2" stroke="#dc2626"/>
  <text x="488" y="561" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#b91c1c">-80</text>
