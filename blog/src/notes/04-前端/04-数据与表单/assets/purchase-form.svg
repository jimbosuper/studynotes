  <text x="356" y="481" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#64748b">数量</text>
  <text x="486" y="481" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#64748b">单价</text>
