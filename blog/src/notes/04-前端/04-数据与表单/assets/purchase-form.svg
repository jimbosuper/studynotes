  <text x="676" y="268" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">PDF / PNG，单个不超过 5MB</text>

  <rect x="620" y="314" width="256" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="628" y="321" width="20" height="20" rx="3" fill="#fef2f2"/>
