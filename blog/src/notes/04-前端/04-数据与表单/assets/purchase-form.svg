  <text x="808" y="561" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#1d4ed8">上移</text>
  <text x="850" y="561" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#1d4ed8">删除</text>
  <text x="478" y="586" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#dc2626">第 2 行单价不能为负</text>

  <!-- 行 3 -->
  <rect x="48" y="594" width="292" height="26" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="58" y="611" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#1f2937">SKU-7712 继电器</text>
  <text x="364" y="611" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#1f2937">10</text>
  <text x="486" y="611" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#1f2937">¥202.00</text>
  <text x="626" y="611" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#1f2937">¥2,020.00</text>
  <text x="808" y="611" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#1d4ed8">上移</text>
  <text x="850" y="611" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#1d4ed8">删除</text>

  <rect x="44" y="628" width="92" height="24" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="58" y="644" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#1d4ed8">+ 添加一行</text>
