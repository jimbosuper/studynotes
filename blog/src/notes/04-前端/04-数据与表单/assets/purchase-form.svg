  <text x="210" y="72" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#94a3b8">草稿自动保存 · 最近保存 10:46</text>
  <rect x="760" y="52" width="60" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="774" y="69" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#475569">取消</text>
