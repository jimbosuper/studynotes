  <rect x="48" y="502" width="292" height="26" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="58" y="519" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#1f2937">SKU-8841 伺服电机</text>
  <text x="364" y="519" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#1f2937">2</text>
  <text x="486" y="519" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#1f2937">¥1,200.00</text>
  <text x="626" y="519" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#1f2937">¥2,400.00</text>
  <text x="808" y="519" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#1d4ed8">上移</text>
  <text x="850" y="519" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">删除</text>
  <line x1="44" y1="536" x2="876" y2="536" stroke="#f1f5f9"/>

