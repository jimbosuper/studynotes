  <text x="843" y="69" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#ffffff">提交</text>

  <!-- 错误摘要 -->
  <rect x="24" y="106" width="872" height="52" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="44" y="128" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#b91c1c">有 2 处需要修改</text>
  <text x="44" y="146" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#b91c1c">· 申请理由至少 10 个字　· 第 2 行单价不能为负</text>
  <text x="838" y="138" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#dc2626">已聚焦</text>

