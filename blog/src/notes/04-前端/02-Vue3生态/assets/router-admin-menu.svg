<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460">
  <rect width="720" height="460" fill="#f8fafc"/>
  <text x="24" y="26" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#94a3b8">按角色生成的侧边菜单（客服账号登录）</text>

  <!-- 布局容器 -->
  <rect x="24" y="42" width="672" height="380" rx="8" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- 侧边栏 -->
  <rect x="24" y="42" width="168" height="380" rx="8" fill="#f1f5f9"/>
  <text x="44" y="72" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1f2937">运营后台</text>

  <rect x="36" y="90" width="144" height="34" rx="6" fill="#ffffff"/>
  <text x="52" y="112" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#1d4ed8">工作台</text>
  <text x="52" y="144" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#475569">工单</text>

  <!-- 空位说明：被过滤掉的菜单 -->
  <text x="52" y="186" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">用户管理 / 订单管理</text>
  <text x="52" y="202" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">按 role 过滤，不渲染</text>

  <!-- 用户信息 -->
  <rect x="36" y="360" width="144" height="44" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="58" cy="382" r="12" fill="#dbeafe"/>
  <text x="54" y="386" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#1d4ed8">客</text>
  <text x="80" y="379" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#1f2937">客服小王</text>
  <text x="80" y="394" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#64748b">role: agent</text>

  <!-- 主内容 -->
  <text x="216" y="72" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#1f2937">工单列表</text>
  <text x="216" y="92" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#64748b">路由 /tickets · 刷新后守卫重建动态路由</text>

  <rect x="216" y="108" width="456" height="40" rx="6" fill="#f8fafc"/>
  <text x="230" y="132" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#64748b">编号</text>
  <text x="320" y="132" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#64748b">标题</text>
  <text x="480" y="132" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#64748b">优先级</text>
  <text x="580" y="132" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#64748b">状态</text>

  <rect x="216" y="156" width="456" height="44" rx="6" fill="#ffffff" stroke="#f1f5f9"/>
  <text x="230" y="182" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#475569">TK-2041</text>
  <text x="320" y="182" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#1f2937">导出报表失败</text>
  <rect x="480" y="170" width="44" height="18" rx="9" fill="#fffbeb"/>
  <text x="490" y="183" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#92400e">高</text>
  <text x="580" y="182" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#166534">处理中</text>

  <rect x="216" y="204" width="456" height="44" rx="6" fill="#ffffff" stroke="#f1f5f9"/>
  <text x="230" y="230" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#475569">TK-2040</text>
  <text x="320" y="230" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#1f2937">登录验证码收不到</text>
  <rect x="480" y="218" width="44" height="18" rx="9" fill="#f8fafc"/>
  <text x="490" y="231" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">中</text>
  <text x="580" y="230" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#64748b">待受理</text>

  <!-- 403 提示 -->
  <rect x="216" y="270" width="456" height="118" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="234" y="296" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#92400e">访问 /users 被守卫拦截</text>
  <text x="234" y="318" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#92400e">meta.roles = ['admin']，当前 role = 'agent'</text>
  <text x="234" y="338" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#92400e">beforeEach 返回 { name: 'forbidden' }</text>
  <rect x="234" y="350" width="88" height="26" rx="6" fill="#ffffff" stroke="#fcd34d"/>
  <text x="250" y="367" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#92400e">查看 403 页</text>

  <text x="24" y="442" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">菜单位置由 meta.menu 控制，可见性由 meta.roles 控制，同一份路由表驱动两者</text>
</svg>
