<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700">
  <rect width="960" height="700" fill="#f8fafc"/>
  <text x="24" y="26" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#94a3b8">发布会报名页效果（SSR + Nitro 接口）</text>

  <!-- 顶部导航 -->
  <rect x="24" y="42" width="912" height="56" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="44" y="58" width="24" height="24" rx="6" fill="#1d4ed8"/>
  <text x="78" y="76" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1f2937">Acme</text>
  <text x="660" y="76" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#475569">产品</text>
  <text x="708" y="76" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#475569">客户案例</text>
  <text x="776" y="76" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#475569">定价</text>
  <rect x="836" y="56" width="78" height="28" rx="6" fill="#1d4ed8"/>
  <text x="858" y="75" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#ffffff">立即报名</text>

  <!-- 主视觉 -->
  <rect x="24" y="114" width="560" height="286" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="44" y="138" width="122" height="24" rx="12" fill="#eff6ff"/>
  <text x="58" y="155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#1d4ed8">2026 年度发布会</text>
  <text x="44" y="204" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="600" fill="#0f172a">Acme 2026</text>
  <text x="44" y="242" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="600" fill="#0f172a">产品发布会</text>
  <text x="44" y="278" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">现场演示三条产品线的新能力，与 200 位同行交流落地经验。</text>

  <rect x="44" y="300" width="160" height="62" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="322" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#64748b">时间</text>
  <text x="60" y="344" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#1f2937">11 月 28 日 14:00</text>

  <rect x="220" y="300" width="160" height="62" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="236" y="322" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#64748b">地点</text>
  <text x="236" y="344" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#1f2937">上海世博中心</text>

  <rect x="396" y="300" width="168" height="62" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="412" y="322" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#64748b">形式</text>
  <text x="412" y="344" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#1f2937">线下 + 直播</text>

  <!-- 报名表单 -->
  <rect x="604" y="114" width="332" height="286" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="624" y="146" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#0f172a">预约席位</text>
  <text x="624" y="168" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#64748b">提交后 1 个工作日内确认</text>

  <text x="624" y="196" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#475569">姓名</text>
  <rect x="624" y="204" width="292" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="636" y="225" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#94a3b8">请输入姓名</text>

  <text x="624" y="256" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#475569">企业邮箱</text>
  <rect x="624" y="264" width="292" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="636" y="285" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#94a3b8">name@company.com</text>

  <rect x="624" y="308" width="13" height="13" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="645" y="319" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#64748b">同意隐私政策，接收活动通知</text>

  <rect x="624" y="340" width="292" height="36" rx="6" fill="#1d4ed8"/>
  <text x="748" y="363" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#ffffff">提交报名</text>

  <!-- 议程 -->
  <rect x="24" y="420" width="912" height="246" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="44" y="452" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#0f172a">活动议程</text>
  <text x="916" y="452" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">数据来自 /api/launch，缓存 5 分钟</text>

  <rect x="44" y="470" width="872" height="38" rx="6" fill="#f8fafc"/>
  <text x="58" y="494" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#64748b">14:00</text>
  <text x="108" y="494" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#1f2937">开场：三条产品线的一年</text>
  <text x="904" y="494" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#64748b" text-anchor="end">主会场</text>

  <text x="58" y="536" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#64748b">14:30</text>
  <text x="108" y="536" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#1f2937">数据平台：从报表到实时决策</text>
  <text x="904" y="536" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#64748b" text-anchor="end">主会场</text>

  <text x="58" y="578" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#64748b">15:30</text>
  <text x="108" y="578" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#1f2937">客户圆桌：迁移与落地</text>
  <text x="904" y="578" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#64748b" text-anchor="end">分会场 A</text>

  <text x="58" y="620" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#64748b">16:30</text>
  <text x="108" y="620" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#1f2937">自由交流与展台体验</text>
  <text x="904" y="620" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#64748b" text-anchor="end">展区</text>

  <text x="24" y="688" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">首屏由 Nitro 服务端渲染，源码包含 h1 与议程；表单提交带幂等键，重复点击不会产生重复线索</text>
</svg>
