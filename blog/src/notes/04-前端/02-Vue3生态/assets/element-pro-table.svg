<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470">
  <rect width="720" height="470" fill="#f8fafc"/>
  <text x="24" y="26" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#94a3b8">ProTable 订单表格页效果（品牌主色 #2563eb）</text>

  <!-- 顶栏 -->
  <rect x="24" y="42" width="672" height="48" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="44" y="71" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1f2937">订单管理</text>
  <rect x="600" y="55" width="80" height="24" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="618" y="71" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">切换暗色</text>

  <!-- 筛选区 -->
  <rect x="24" y="100" width="672" height="56" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="44" y="116" width="180" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="54" y="132" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">订单号 / 客户</text>
