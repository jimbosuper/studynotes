  <rect x="412" y="114" width="60" height="26" rx="4" fill="#2563eb"/>
  <text x="426" y="131" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#ffffff">查询</text>
  <rect x="484" y="114" width="60" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="498" y="131" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">重置</text>

  <!-- 表格 -->
  <rect x="24" y="166" width="672" height="238" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="24" y="166" width="672" height="34" fill="#f8fafc"/>
  <rect x="38" y="176" width="14" height="14" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
