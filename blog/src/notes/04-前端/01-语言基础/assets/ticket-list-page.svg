  <path d="M 900 580 l -3.5 4.5 h 7 z" fill="#64748b" transform="rotate(90 903.5 584)"/>
  <text x="916" y="588" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#64748b">›</text>
