  <circle cx="902" cy="64" r="15" fill="#eff6ff"/>
  <text x="896.5" y="68.5" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#1d4ed8">ZL</text>

