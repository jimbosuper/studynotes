  <rect x="32" y="166" width="184" height="34" rx="8" fill="none"/>
  <text x="48" y="188" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#64748b">客户</text>
  <rect x="32" y="206" width="184" height="34" rx="8" fill="none"/>
  <text x="48" y="228" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#64748b">报表</text>
  <line x1="32" y1="548" x2="216" y2="548" stroke="#e2e8f0"/>
  <circle cx="46" cy="570" r="11" fill="#eff6ff"/>
  <text x="43" y="574" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="600" fill="#1d4ed8">ZL</text>
  <text x="64" y="574" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#64748b">张岚 · 客服主管</text>

  <!-- 顶栏 -->
  <rect x="236" y="36" width="704" height="56" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="252" y="50" width="420" height="28" rx="7" fill="#f1f5f9"/>
  <circle cx="270" cy="64" r="6" fill="none" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="274.5" y1="68.5" x2="279" y2="64" stroke="#94a3b8" stroke-width="1.6"/>
