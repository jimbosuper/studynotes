<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <rect width="720" height="480" fill="#f8fafc"/>
  <text x="24" y="26" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#94a3b8">订单详情页效果</text>

  <!-- 页头 -->
  <rect x="24" y="42" width="672" height="64" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="44" y="68" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="600" fill="#1f2937">订单详情</text>
  <text x="44" y="88" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#64748b">订单号：SO-20261113-001</text>
  <rect x="560" y="60" width="112" height="28" rx="6" fill="#fffbeb"/>
  <text x="580" y="79" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#92400e">待发货</text>

  <!-- 导航 -->
  <rect x="24" y="118" width="672" height="38" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="44" y="142" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#1d4ed8">订单</text>
  <text x="96" y="142" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#475569">客户</text>

  <!-- 主内容 -->
  <rect x="24" y="172" width="440" height="220" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="44" y="198" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1f2937">基本信息</text>
  <text x="44" y="224" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#64748b">状态</text>
  <text x="120" y="224" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#1f2937">待发货</text>
  <text x="44" y="248" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#64748b">金额</text>
  <text x="120" y="248" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#1f2937">¥499.00</text>

  <text x="44" y="282" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1f2937">商品明细</text>
  <rect x="44" y="296" width="400" height="28" rx="4" fill="#f8fafc"/>
  <text x="54" y="315" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#64748b">商品</text>
  <text x="236" y="315" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#64748b">数量</text>
  <text x="306" y="315" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#64748b">单价</text>
  <text x="54" y="344" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#1f2937">机械键盘</text>
  <text x="244" y="344" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#1f2937">1</text>
  <text x="306" y="344" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#1f2937">¥499.00</text>

  <!-- 侧栏 -->
  <rect x="484" y="172" width="212" height="220" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="504" y="198" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1f2937">相关操作</text>
  <rect x="504" y="216" width="172" height="34" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="552" y="238" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#1d4ed8">申请售后</text>
  <text x="504" y="278" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">侧栏用 aside，与主内容分开</text>

  <!-- 页脚 -->
  <rect x="24" y="412" width="672" height="40" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="44" y="437" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#64748b">客服：400-000-0000</text>

  <text x="24" y="468" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">header / nav / main / aside / footer 的结构，在视觉上也要能看出主次</text>
</svg>
