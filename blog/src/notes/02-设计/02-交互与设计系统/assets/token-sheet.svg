<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560">
  <rect width="760" height="560" fill="#f8fafc"/>
  <text x="24" y="30" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1f2937">设计令牌对照：三层结构与暗色模式</text>
  <text x="24" y="50" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#94a3b8">同一份源文件导出到 Figma Variables 与 CSS 变量，语义层负责换主题</text>

  <!-- 基础层 -->
  <rect x="24" y="68" width="712" height="146" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="92" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#1e3a8a">① 基础层 Primitives</text>
  <text x="190" y="92" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">只被语义层引用，不直接进组件</text>

  <rect x="40" y="108" width="96" height="44" rx="6" fill="#2563eb"/>
  <text x="40" y="168" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">color.blue.500</text>
  <text x="40" y="182" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">#2563eb</text>

  <rect x="156" y="108" width="96" height="44" rx="6" fill="#1d4ed8"/>
  <text x="156" y="168" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">color.blue.600</text>
  <text x="156" y="182" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">#1d4ed8</text>

  <rect x="272" y="108" width="96" height="44" rx="6" fill="#0f172a"/>
  <text x="272" y="168" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">color.neutral.900</text>
  <text x="272" y="182" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">#0f172a</text>

  <rect x="388" y="108" width="96" height="44" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="388" y="168" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">color.neutral.50</text>
  <text x="388" y="182" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">#f8fafc</text>

  <rect x="504" y="108" width="96" height="44" rx="6" fill="#b91c1c"/>
  <text x="504" y="168" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">color.red.600</text>
  <text x="504" y="182" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">#b91c1c</text>

  <rect x="620" y="108" width="96" height="44" rx="6" fill="#15803d"/>
  <text x="620" y="168" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">color.green.700</text>
  <text x="620" y="182" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">#15803d</text>

  <!-- 语义层 -->
  <rect x="24" y="228" width="712" height="150" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="252" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#166534">② 语义层 Semantic</text>
  <text x="196" y="252" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">引用基础层，组件只消费这一层</text>

  <rect x="40" y="266" width="130" height="28" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="52" y="285" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">color.surface.base</text>
  <text x="186" y="285" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">→ {color.neutral.50}</text>
  <rect x="360" y="270" width="22" height="20" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>

  <rect x="40" y="302" width="130" height="28" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="52" y="321" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">color.text.primary</text>
  <text x="186" y="321" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">→ {color.neutral.900}</text>
  <rect x="360" y="306" width="22" height="20" rx="4" fill="#0f172a"/>

  <rect x="40" y="338" width="130" height="28" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="52" y="357" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">color.action.primary</text>
  <text x="186" y="357" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">→ {color.blue.500}</text>
  <rect x="360" y="342" width="22" height="20" rx="4" fill="#2563eb"/>

  <rect x="420" y="266" width="130" height="28" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="432" y="285" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">color.border.strong</text>
  <text x="566" y="285" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">→ {color.neutral.400}</text>
  <rect x="700" y="270" width="22" height="20" rx="4" fill="#94a3b8"/>

  <rect x="420" y="302" width="130" height="28" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="432" y="321" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">color.danger.text</text>
  <text x="566" y="321" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">→ {color.red.600}</text>
  <rect x="700" y="306" width="22" height="20" rx="4" fill="#b91c1c"/>

  <rect x="420" y="338" width="130" height="28" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="432" y="357" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">color.success.text</text>
  <text x="566" y="357" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">→ {color.green.700}</text>
  <rect x="700" y="342" width="22" height="20" rx="4" fill="#15803d"/>

  <!-- 暗色模式 -->
  <rect x="24" y="392" width="712" height="142" rx="10" fill="#0f172a" stroke="#1e293b"/>
  <text x="40" y="416" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#f3f4f6">③ Mode: Dark（只换语义层取值）</text>
  <text x="300" y="416" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">基础层数值不变，组件无需改样式</text>

  <rect x="40" y="432" width="150" height="60" rx="8" fill="#111827" stroke="#374151"/>
  <text x="54" y="458" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#f3f4f6">surface.base</text>
  <text x="54" y="476" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#9ca3af">#111827</text>

  <rect x="204" y="432" width="150" height="60" rx="8" fill="#1f2937" stroke="#374151"/>
  <text x="218" y="458" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#f3f4f6">text.primary</text>
  <text x="218" y="476" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#9ca3af">#f3f4f6（对比 16.1:1）</text>

  <rect x="368" y="432" width="150" height="60" rx="8" fill="#3b82f6"/>
  <text x="382" y="458" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#0b1220">action.primary</text>
  <text x="382" y="476" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#0b1220">#3b82f6 + 深色文字</text>

  <rect x="532" y="432" width="184" height="60" rx="8" fill="#1f2937" stroke="#374151"/>
  <text x="546" y="458" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#f3f4f6">border.default</text>
  <text x="546" y="476" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#9ca3af">#374151（不要纯黑纯白）</text>
</svg>
