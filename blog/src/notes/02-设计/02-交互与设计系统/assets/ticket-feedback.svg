  <text x="40" y="240" font-size="9" fill="#94a3b8">软删除 + 服务端保留恢复能力；不用延迟 8 秒才提交，避免关页丢状态</text>

  <!-- ② 草稿 -->
  <rect x="496" y="44" width="440" height="208" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="512" y="66" font-size="10" fill="#94a3b8">② 草稿 · 自动保存不打断输入</text>
  <rect x="512" y="78" width="408" height="126" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="524" y="98" font-size="10" font-weight="600" fill="#1f2937">回复客户</text>
  <circle cx="762" cy="94" r="3" fill="#16a34a"/>
  <text x="770" y="98" font-size="9" fill="#16a34a">已保存 14:32</text>
  <text x="524" y="120" font-size="10" fill="#475569">已确认 G1/0/24 端口 err-disable，备件 14:00 到达，</text>
  <text x="524" y="136" font-size="10" fill="#475569">更换后我们会立即复测并同步结果。</text>
  <line x1="524" y1="150" x2="908" y2="150" stroke="#f1f5f9"/>
