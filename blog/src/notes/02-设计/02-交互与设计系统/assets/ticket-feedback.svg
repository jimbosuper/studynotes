  <rect x="40" y="78" width="408" height="82" rx="6" fill="#f8fafc"/>
  <text x="56" y="100" font-size="10" fill="#94a3b8">T-20261113-042</text>
  <rect x="360" y="88" width="56" height="18" rx="9" fill="#f1f5f9"/>
  <text x="368" y="101" font-size="9" fill="#475569">已关闭</text>
