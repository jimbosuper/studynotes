  <text x="360" y="340" font-size="9" fill="#64748b">用时 1.8s</text>

  <text x="40" y="368" font-size="9" fill="#b91c1c">●</text>
  <text x="52" y="368" font-size="10" fill="#1f2937">T-20261113-031 状态已变更，请刷新后重试</text>
  <text x="40" y="390" font-size="9" fill="#b91c1c">●</text>
  <text x="52" y="390" font-size="10" fill="#1f2937">T-20261112-118 无权限：不在你的技能组</text>
  <line x1="40" y1="404" x2="448" y2="404" stroke="#f1f5f9"/>
  <rect x="40" y="416" width="100" height="26" rx="5" fill="#2563eb"/>
  <text x="52" y="433" font-size="10" fill="#ffffff">只重试失败项</text>
  <text x="152" y="433" font-size="10" fill="#2563eb">导出失败明细</text>
  <text x="40" y="466" font-size="9" fill="#94a3b8">不重跑整批；成功项已生效，失败项保留原因与单条重试</text>

  <!-- ④ 结果未知 -->
  <rect x="496" y="270" width="440" height="214" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="512" y="292" font-size="10" fill="#94a3b8">④ 超时 · 结果未知不等于失败</text>
  <rect x="512" y="302" width="408" height="144" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="536" cy="326" r="10" fill="#fffbeb"/>
  <text x="532" y="330" font-size="11" font-weight="600" fill="#92400e">!</text>
  <text x="556" y="330" font-size="11" font-weight="600" fill="#1f2937">回复已发出，结果确认中</text>
  <text x="528" y="354" font-size="10" fill="#475569">网络超时，服务端可能已处理。请勿重复提交，</text>
  <text x="528" y="370" font-size="10" fill="#475569">可查询结果后再决定是否重试。</text>
  <rect x="528" y="384" width="84" height="24" rx="5" fill="#2563eb"/>
  <text x="542" y="400" font-size="10" fill="#ffffff">查询结果</text>
  <rect x="620" y="384" width="72" height="24" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="634" y="400" font-size="10" fill="#475569">稍后再查</text>
  <text x="528" y="430" font-size="9" fill="#94a3b8">幂等键 8f3a…c21 · 请求时间 14:32:08 · 错误码 E-504-0912</text>
  <text x="512" y="468" font-size="9" fill="#94a3b8">写操作不自动重试；重试沿用同一幂等键，避免重复回复</text>
</svg>
