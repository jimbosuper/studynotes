<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600">
  <rect width="960" height="600" fill="#f8fafc"/>

  <text x="24" y="26" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#94a3b8">新建订单弹窗 · 可用性与可访问性改造前后</text>

  <text x="24" y="48" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#b91c1c">改版前：键盘不可达、错误只标红、触控目标偏小</text>
  <text x="496" y="48" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#15803d">改版后：焦点可见、错误可读、目标 44×44</text>

  <!-- 改版前 -->
  <rect x="24" y="60" width="440" height="478" rx="12" fill="#f1f5f9" stroke="#e2e8f0"/>
  <rect x="60" y="88" width="368" height="424" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="84" y="124" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#1f2937">新建订单</text>
  <text x="392" y="124" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#94a3b8">×</text>

  <text x="84" y="160" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#9ca3af">客户名称</text>
  <rect x="84" y="170" width="320" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="96" y="192" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#334155">张三</text>

  <text x="84" y="230" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#9ca3af">订单金额</text>
  <rect x="84" y="240" width="320" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="96" y="262" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#334155">499</text>

  <text x="84" y="300" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#9ca3af">交付日期</text>
  <rect x="84" y="310" width="320" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="96" y="332" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#334155">2026-11-20</text>

  <text x="84" y="372" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#ef4444">金额格式不正确</text>

  <rect x="252" y="396" width="64" height="30" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="272" y="415" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#475569">取消</text>
  <rect x="328" y="396" width="76" height="30" rx="4" fill="#60a5fa"/>
  <text x="349" y="415" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#ffffff">提交</text>

  <text x="60" y="470" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">错误文字离字段 100px，读屏不朗读；关闭按钮命中区约 16px</text>

  <!-- 改版后 -->
  <rect x="496" y="60" width="440" height="478" rx="12" fill="#f1f5f9" stroke="#e2e8f0"/>
  <rect x="532" y="88" width="368" height="424" rx="8" fill="#ffffff" stroke="#e2e8f0"/>

  <rect x="552" y="104" width="280" height="44" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <circle cx="568" cy="126" r="8" fill="#dc2626"/>
  <text x="564" y="130" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#ffffff">!</text>
  <text x="584" y="122" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#991b1b">有 2 个字段需要处理</text>
  <text x="584" y="137" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#b91c1c">订单金额、交付日期</text>

  <text x="552" y="178" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#1f2937">新建订单</text>
  <rect x="840" y="96" width="44" height="44" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="856" y="123" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#475569">×</text>

  <text x="552" y="202" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#374151">客户名称</text>
  <text x="600" y="202" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#b91c1c">*</text>
  <rect x="552" y="210" width="328" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="566" y="237" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#1f2937">张三</text>

  <text x="552" y="292" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#374151">订单金额</text>
  <text x="600" y="292" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#b91c1c">*</text>
  <rect x="548" y="296" width="336" height="48" rx="9" fill="none" stroke="#2563eb" stroke-width="3"/>
  <rect x="552" y="300" width="328" height="44" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="566" y="327" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#1f2937">-20</text>
  <circle cx="560" cy="356" r="6" fill="#dc2626"/>
  <text x="557" y="359" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="8" fill="#ffffff">!</text>
  <text x="572" y="359" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#b91c1c">金额需为大于 0 的数字</text>

  <text x="552" y="382" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#374151">交付日期</text>
  <text x="600" y="382" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#b91c1c">*</text>
  <rect x="552" y="390" width="328" height="44" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="566" y="415" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#6b7280">选择日期</text>
  <text x="552" y="448" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#b91c1c">请选择交付日期</text>

  <rect x="700" y="456" width="80" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="724" y="483" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#475569">取消</text>
  <rect x="792" y="456" width="88" height="44" rx="6" fill="#2563eb"/>
  <text x="820" y="483" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#ffffff">提交</text>

  <text x="532" y="516" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">错误摘要可聚焦；字段用 aria-invalid 关联错误；按钮高 44px</text>

  <text x="24" y="568" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#475569">① 关闭按钮 44×44　② 错误摘要置于标题上方　③ 焦点环 3px 且不被遮挡　④ 正文对比度 ≥ 4.5:1</text>
  <text x="24" y="586" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">示意稿：字段与数值为示例，改造点对应 WCAG 2.2 AA 与键盘/读屏测试结论</text>
</svg>
