<svg xmlns="http://www.w3.org/2000/svg" width="760" height="580" viewBox="0 0 760 580">
  <rect width="760" height="580" fill="#f8fafc"/>
  <text x="24" y="30" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1f2937">触控目标与安全区标注</text>
  <text x="24" y="50" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#94a3b8">视觉尺寸可以小，命中区不小于 44×44；底部内边距叠加设备安全区</text>

  <!-- 手机外框 -->
  <rect x="60" y="76" width="250" height="470" rx="28" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M142 76 h86 a18 18 0 0 1 18 18 v10 h-122 v-10 a18 18 0 0 1 18-18 z" fill="#0f172a"/>
  <rect x="152" y="84" width="66" height="14" rx="7" fill="#1f2937"/>
  <circle cx="204" cy="91" r="2" fill="#334155"/>

  <!-- 顶部安全区标注 -->
  <rect x="60" y="76" width="250" height="44" fill="#eff6ff" opacity="0.6"/>
  <line x1="60" y1="120" x2="310" y2="120" stroke="#93c5fd" stroke-dasharray="4 3"/>
  <text x="70" y="114" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#1d4ed8">safe-area-inset-top</text>
  <text x="70" y="136" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#1f2937">工单详情</text>

  <!-- 内容 -->
  <text x="72" y="162" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">TK-1042 · 远航物流</text>
  <text x="72" y="182" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#1f2937">配送延迟，客户催单</text>
  <rect x="72" y="194" width="46" height="20" rx="10" fill="#fef2f2"/>
  <text x="83" y="208" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="#b91c1c">高优先级</text>
  <rect x="126" y="194" width="52" height="20" rx="10" fill="#fffbeb"/>
  <text x="137" y="208" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="#92400e">待接单</text>

  <line x1="72" y1="228" x2="298" y2="228" stroke="#e2e8f0"/>
  <text x="72" y="250" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">客户要求今天 18:00 前送达</text>
  <text x="72" y="270" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">仓库已出库，司机反馈路况拥堵</text>
  <rect x="72" y="286" width="226" height="64" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="84" y="306" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="#64748b">处理记录</text>
  <text x="84" y="324" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="#475569">10:12 客服已联系客户</text>
  <text x="84" y="340" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="#475569">10:20 调度改派最近车辆</text>

  <!-- 图标按钮命中区 -->
  <rect x="92" y="374" width="44" height="44" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-dasharray="4 3"/>
  <rect x="98" y="380" width="32" height="32" rx="8" fill="#2563eb"/>
  <text x="108" y="401" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#ffffff">↗</text>
  <text x="152" y="390" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="#1d4ed8">命中区 44×44</text>
  <text x="152" y="404" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="#64748b">视觉 32px</text>
  <text x="152" y="418" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="#64748b">伪元素外扩 6px</text>

  <rect x="216" y="362" width="80" height="48" rx="8" fill="#2563eb"/>
  <text x="238" y="393" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#ffffff">接单</text>
  <text x="216" y="428" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="#64748b">主操作 48 高</text>

  <!-- 底部安全区 -->
  <rect x="60" y="482" width="250" height="64" fill="#eff6ff" opacity="0.65"/>
  <rect x="60" y="470" width="250" height="46" fill="#ffffff"/>
  <line x1="60" y1="470" x2="310" y2="470" stroke="#e2e8f0"/>
  <rect x="72" y="478" width="106" height="40" rx="8" fill="#2563eb"/>
  <text x="94" y="503" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#ffffff">完成工单</text>
  <rect x="188" y="478" width="106" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="214" y="503" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#334155">转派</text>
  <line x1="60" y1="516" x2="310" y2="516" stroke="#93c5fd" stroke-dasharray="4 3"/>
  <text x="70" y="534" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="#1d4ed8">safe-area-inset-bottom</text>
  <rect x="160" y="536" width="50" height="4" rx="2" fill="#94a3b8"/>

  <!-- 右侧说明 -->
  <rect x="350" y="76" width="386" height="470" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="370" y="104" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#1e3a8a">落位规则</text>

  <text x="370" y="134" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#1f2937">1. 触控目标</text>
  <text x="370" y="154" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">图标按钮视觉 32px，命中区 44×44。</text>
  <text x="370" y="172" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">相邻目标间距 ≥8px，避免误触。</text>

  <text x="370" y="204" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#1f2937">2. 底部安全区</text>
  <text x="370" y="224" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">操作栏内边距 = 12px + env(safe-area-inset-bottom)。</text>
  <text x="370" y="242" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">桌面端 env 为 0，同一套样式不额外留白。</text>

  <text x="370" y="274" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#1f2937">3. 顶部安全区</text>
  <text x="370" y="294" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">沉浸式页头用 padding-top: env(safe-area-inset-top)。</text>
  <text x="370" y="312" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">普通页头由浏览器状态栏占位，不重复加。</text>

  <text x="370" y="344" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#1f2937">4. 视口高度</text>
  <text x="370" y="364" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">页面用 100svh，弹层用 80dvh。</text>
  <text x="370" y="382" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">不用 100vh，避免地址栏收放导致跳动。</text>

  <text x="370" y="414" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#1f2937">5. 软键盘</text>
  <text x="370" y="434" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">监听 visualViewport，输入框聚焦时上移。</text>
  <text x="370" y="452" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">不要用固定 bottom 值硬顶。</text>

  <rect x="370" y="474" width="346" height="52" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="384" y="494" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#92400e">易错：只加 env() 不加常规内边距，无刘海设备上会贴边；</text>
  <text x="384" y="512" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#92400e">四条边都加安全区，横屏会出现不必要的空白。</text>
</svg>
