<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440">
  <rect width="720" height="440" fill="#f8fafc"/>
  <text x="24" y="26" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#94a3b8">图标网格：24px 画板、20px 内容区、统一线宽与关键形状</text>

  <!-- 左：网格 -->
  <rect x="24" y="42" width="372" height="372" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="66" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1f2937">24px 网格与内容区</text>

  <!-- 网格底 -->
  <rect x="60" y="90" width="240" height="240" fill="#ffffff" stroke="#e2e8f0"/>
  <!-- 1px 网格线 -->
  <g stroke="#f1f5f9" stroke-width="1">
    <line x1="70" y1="90" x2="70" y2="330"/><line x1="80" y1="90" x2="80" y2="330"/>
    <line x1="90" y1="90" x2="90" y2="330"/><line x1="100" y1="90" x2="100" y2="330"/>
    <line x1="110" y1="90" x2="110" y2="330"/><line x1="120" y1="90" x2="120" y2="330"/>
    <line x1="130" y1="90" x2="130" y2="330"/><line x1="140" y1="90" x2="140" y2="330"/>
    <line x1="150" y1="90" x2="150" y2="330"/><line x1="160" y1="90" x2="160" y2="330"/>
    <line x1="170" y1="90" x2="170" y2="330"/><line x1="180" y1="90" x2="180" y2="330"/>
    <line x1="190" y1="90" x2="190" y2="330"/><line x1="200" y1="90" x2="200" y2="330"/>
    <line x1="210" y1="90" x2="210" y2="330"/><line x1="220" y1="90" x2="220" y2="330"/>
    <line x1="230" y1="90" x2="230" y2="330"/><line x1="240" y1="90" x2="240" y2="330"/>
    <line x1="250" y1="90" x2="250" y2="330"/><line x1="260" y1="90" x2="260" y2="330"/>
    <line x1="270" y1="90" x2="270" y2="330"/><line x1="280" y1="90" x2="280" y2="330"/>
    <line x1="290" y1="90" x2="290" y2="330"/>
    <line x1="60" y1="100" x2="300" y2="100"/><line x1="60" y1="110" x2="300" y2="110"/>
    <line x1="60" y1="120" x2="300" y2="120"/><line x1="60" y1="130" x2="300" y2="130"/>
    <line x1="60" y1="140" x2="300" y2="140"/><line x1="60" y1="150" x2="300" y2="150"/>
    <line x1="60" y1="160" x2="300" y2="160"/><line x1="60" y1="170" x2="300" y2="170"/>
    <line x1="60" y1="180" x2="300" y2="180"/><line x1="60" y1="190" x2="300" y2="190"/>
    <line x1="60" y1="200" x2="300" y2="200"/><line x1="60" y1="210" x2="300" y2="210"/>
    <line x1="60" y1="220" x2="300" y2="220"/><line x1="60" y1="230" x2="300" y2="230"/>
    <line x1="60" y1="240" x2="300" y2="240"/><line x1="60" y1="250" x2="300" y2="250"/>
    <line x1="60" y1="260" x2="300" y2="260"/><line x1="60" y1="270" x2="300" y2="270"/>
    <line x1="60" y1="280" x2="300" y2="280"/><line x1="60" y1="290" x2="300" y2="290"/>
    <line x1="60" y1="300" x2="300" y2="300"/><line x1="60" y1="310" x2="300" y2="310"/>
    <line x1="60" y1="320" x2="300" y2="320"/>
  </g>
  <!-- 中心十字线 -->
  <line x1="180" y1="90" x2="180" y2="330" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="60" y1="210" x2="300" y2="210" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 内容区 20px（缩放到 200px） -->
  <rect x="80" y="110" width="200" height="200" rx="4" fill="none" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="6 4"/>
  <!-- 正方形 18px（180px） -->
  <rect x="90" y="120" width="180" height="180" fill="none" stroke="#16a34a" stroke-width="1.5" opacity="0.55"/>
  <!-- 圆形 20px -->
  <circle cx="180" cy="210" r="99" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.6"/>
  <!-- 对角线 -->
  <line x1="100" y1="260" x2="260" y2="100" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="180" cy="210" r="3" fill="#1f2937"/>

  <!-- 标注 -->
  <text x="60" y="352" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#2563eb">蓝：内容区 20px</text>
  <text x="60" y="368" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#15803d">绿：正方形 18px</text>
  <text x="60" y="384" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#b45309">橙：圆形 20px</text>
  <text x="60" y="400" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">灰虚线：对角线，起点落在 2px 偏移上</text>

  <!-- 右：同族图标 -->
  <rect x="420" y="42" width="276" height="248" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="436" y="66" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1f2937">同族一致性（线性 1.5px）</text>

  <!-- 搜索 -->
  <rect x="436" y="82" width="72" height="72" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <line x1="436" y1="118" x2="508" y2="118" stroke="#e2e8f0" stroke-dasharray="3 3"/>
  <line x1="472" y1="82" x2="472" y2="154" stroke="#e2e8f0" stroke-dasharray="3 3"/>
  <circle cx="467" cy="113" r="14" fill="none" stroke="#334155" stroke-width="3"/>
  <line x1="478" y1="124" x2="489" y2="135" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <text x="436" y="172" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">search</text>

  <!-- 返回 -->
  <rect x="522" y="82" width="72" height="72" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <line x1="522" y1="118" x2="594" y2="118" stroke="#e2e8f0" stroke-dasharray="3 3"/>
  <line x1="558" y1="82" x2="558" y2="154" stroke="#e2e8f0" stroke-dasharray="3 3"/>
  <line x1="540" y1="118" x2="576" y2="118" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <path d="M550,107 L540,118 L550,129" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="522" y="172" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">arrow-left</text>

  <!-- 新增 -->
  <rect x="608" y="82" width="72" height="72" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <line x1="608" y1="118" x2="680" y2="118" stroke="#e2e8f0" stroke-dasharray="3 3"/>
  <line x1="644" y1="82" x2="644" y2="154" stroke="#e2e8f0" stroke-dasharray="3 3"/>
  <line x1="644" y1="104" x2="644" y2="132" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <line x1="630" y1="118" x2="658" y2="118" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <text x="608" y="172" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">plus</text>

  <text x="436" y="206" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#64748b">圆角端点、2px 视觉边距、同一笔画粗细；</text>
  <text x="436" y="224" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#64748b">尺寸靠画板缩放，不单独重画。</text>
  <text x="436" y="250" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#64748b">线性与面性不混用，一个图标一个源文件。</text>
  <text x="436" y="268" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">品牌标识单独存放，不参与同族检查。</text>

  <!-- 尺寸 -->
  <rect x="420" y="302" width="276" height="112" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="436" y="326" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1f2937">16 / 20 / 24 三档</text>
  <text x="436" y="350" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">同一图形按画板等比缩放，线宽保持视觉一致</text>

  <rect x="436" y="362" width="28" height="28" rx="4" fill="#eff6ff"/>
  <circle cx="450" cy="376" r="7" fill="none" stroke="#1d4ed8" stroke-width="1.6"/>
  <line x1="455" y1="381" x2="460" y2="386" stroke="#1d4ed8" stroke-width="1.6" stroke-linecap="round"/>
  <text x="436" y="404" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">16 表格/菜单</text>

  <rect x="516" y="357" width="36" height="36" rx="5" fill="#eff6ff"/>
  <circle cx="534" cy="375" r="9" fill="none" stroke="#1d4ed8" stroke-width="1.8"/>
  <line x1="540" y1="381" x2="547" y2="388" stroke="#1d4ed8" stroke-width="1.8" stroke-linecap="round"/>
  <text x="510" y="404" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">20 工具栏</text>

  <rect x="596" y="352" width="44" height="44" rx="6" fill="#eff6ff"/>
  <circle cx="618" cy="374" r="11" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="626" y1="382" x2="634" y2="390" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round"/>
  <text x="586" y="404" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">24 页面/导航</text>
</svg>
