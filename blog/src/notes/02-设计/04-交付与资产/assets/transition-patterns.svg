<svg xmlns="http://www.w3.org/2000/svg" width="720" height="476" viewBox="0 0 720 476">
  <rect width="720" height="476" fill="#f8fafc"/>
  <text x="24" y="26" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#94a3b8">动效的三个层级：同一时刻只动一层，内层先结束、外层后开始</text>

  <!-- 组件级 -->
  <rect x="24" y="42" width="672" height="108" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="24" y="42" width="6" height="108" rx="3" fill="#93c5fd"/>
  <text x="44" y="68" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1f2937">组件级</text>
  <text x="44" y="88" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#94a3b8">100–200ms · 按压、hover、开关</text>
  <text x="44" y="108" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#64748b">只改变组件自身状态</text>

  <rect x="286" y="66" width="104" height="34" rx="7" fill="#2563eb"/>
  <text x="314" y="88" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#ffffff">提交订单</text>
  <text x="404" y="88" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#94a3b8">→</text>
  <text x="286" y="126" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">120ms · ease-out</text>

  <rect x="452" y="68" width="100" height="30" rx="6" fill="#1e40af"/>
  <text x="478" y="88" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#ffffff">提交订单</text>
  <text x="456" y="126" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">按下 scale 0.96 · 立即回弹</text>

  <!-- 容器级 -->
  <rect x="24" y="160" width="672" height="112" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="24" y="160" width="6" height="112" rx="3" fill="#60a5fa"/>
  <text x="44" y="186" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1f2937">容器级</text>
  <text x="44" y="206" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#94a3b8">200–300ms · 抽屉、弹层、展开行</text>
  <text x="44" y="226" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#64748b">空间位置发生变化</text>

  <rect x="286" y="184" width="118" height="68" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="298" y="196" width="70" height="7" rx="3" fill="#cbd5e1"/>
  <rect x="298" y="210" width="92" height="7" rx="3" fill="#e2e8f0"/>
  <rect x="298" y="224" width="60" height="7" rx="3" fill="#e2e8f0"/>
  <text x="286" y="268" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">列表页</text>

  <text x="416" y="228" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#94a3b8">→</text>
  <text x="416" y="188" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="#94a3b8">位移 100%→0</text>
  <text x="416" y="202" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="#94a3b8">240ms</text>

  <rect x="488" y="184" width="182" height="68" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="502" y="202" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#1e3a8a">订单详情</text>
  <rect x="502" y="212" width="80" height="6" rx="3" fill="#bfdbfe"/>
  <rect x="502" y="224" width="110" height="6" rx="3" fill="#dbeafe"/>
  <rect x="502" y="236" width="64" height="6" rx="3" fill="#dbeafe"/>
  <text x="488" y="268" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">抽屉 240ms · 标准缓动</text>

  <!-- 场景级 -->
  <rect x="24" y="284" width="672" height="192" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="24" y="284" width="6" height="192" rx="3" fill="#1d4ed8"/>
  <text x="44" y="310" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1f2937">场景级</text>
  <text x="44" y="330" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#94a3b8">300–400ms · 路由、登出、引导</text>
  <text x="44" y="350" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#64748b">整页替换，保留来源方向</text>

  <!-- 页面 A -->
  <rect x="286" y="306" width="118" height="92" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="286" y="306" width="118" height="18" rx="6" fill="#f1f5f9"/>
  <text x="296" y="319" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="#64748b">订单列表</text>
  <rect x="298" y="334" width="94" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="298" y="348" width="72" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="298" y="362" width="84" height="6" rx="3" fill="#e2e8f0"/>

  <text x="420" y="354" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#94a3b8">→</text>

  <!-- 页面 B -->
  <rect x="470" y="306" width="118" height="92" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <rect x="470" y="306" width="118" height="18" rx="6" fill="#dbeafe"/>
  <text x="480" y="319" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="#1e3a8a">订单详情</text>
  <rect x="482" y="334" width="94" height="6" rx="3" fill="#bfdbfe"/>
  <rect x="482" y="348" width="74" height="6" rx="3" fill="#bfdbfe"/>
  <rect x="482" y="362" width="86" height="6" rx="3" fill="#bfdbfe"/>

  <text x="286" y="416" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">淡入 + 上移 8px · 300ms · ease-out（页面 B 延时 40ms）</text>

  <rect x="286" y="428" width="370" height="30" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="296" y="447" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#92400e">规则：内层先结束；外层转场期间不再叠加入场动画；返回用反向曲线。</text>
</svg>
