    <rect x="40" y="218" width="24" height="24" fill="#2563eb"/><text x="72" y="235">24</text>
    <rect x="110" y="82" width="32" height="24" fill="#2563eb"/><text x="150" y="99">32</text>
    <rect x="110" y="116" width="48" height="24" fill="#1d4ed8"/><text x="166" y="133">48</text>
  </g>

  <text x="300" y="68" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#64748b">12 列栅格（示意）</text>
  <g>
    <rect x="300" y="82" width="10" height="180" rx="2" fill="#dbeafe" stroke="#bfdbfe"/>
    <rect x="334" y="82" width="10" height="180" rx="2" fill="#dbeafe" stroke="#bfdbfe"/>
    <rect x="368" y="82" width="10" height="180" rx="2" fill="#dbeafe" stroke="#bfdbfe"/>
    <rect x="402" y="82" width="10" height="180" rx="2" fill="#dbeafe" stroke="#bfdbfe"/>
    <rect x="436" y="82" width="10" height="180" rx="2" fill="#dbeafe" stroke="#bfdbfe"/>
    <rect x="470" y="82" width="10" height="180" rx="2" fill="#dbeafe" stroke="#bfdbfe"/>
    <rect x="504" y="82" width="10" height="180" rx="2" fill="#dbeafe" stroke="#bfdbfe"/>
    <rect x="538" y="82" width="10" height="180" rx="2" fill="#dbeafe" stroke="#bfdbfe"/>
    <rect x="572" y="82" width="10" height="180" rx="2" fill="#dbeafe" stroke="#bfdbfe"/>
    <rect x="606" y="82" width="10" height="180" rx="2" fill="#dbeafe" stroke="#bfdbfe"/>
    <rect x="640" y="82" width="10" height="180" rx="2" fill="#dbeafe" stroke="#bfdbfe"/>
