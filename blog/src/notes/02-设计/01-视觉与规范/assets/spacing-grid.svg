<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320">
  <rect width="720" height="320" fill="#f8fafc"/>
  <text x="40" y="34" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#1f2937">间距令牌与 12 列栅格</text>

  <text x="40" y="68" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#64748b">4 / 8 / 12 / 16 / 24 / 32 / 48</text>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#475569">
    <rect x="40" y="82" width="4" height="24" fill="#bfdbfe"/><text x="52" y="99">4</text>
    <rect x="40" y="116" width="8" height="24" fill="#93c5fd"/><text x="56" y="133">8</text>
