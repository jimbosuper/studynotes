<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420">
  <rect width="720" height="420" fill="#f8fafc"/>
  <text x="24" y="26" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#94a3b8">订单列表改版效果</text>

  <!-- 侧栏 -->
  <rect x="24" y="42" width="132" height="348" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="70" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1f2937">企业后台</text>
  <rect x="40" y="88" width="100" height="28" rx="6" fill="#eff6ff"/>
  <text x="54" y="107" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#1d4ed8">订单</text>
  <text x="54" y="139" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#475569">客户</text>
  <text x="54" y="171" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#475569">报表</text>

  <!-- 主区域 -->
  <rect x="172" y="42" width="524" height="348" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="192" y="72" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="600" fill="#1f2937">订单列表</text>
  <rect x="584" y="54" width="88" height="28" rx="6" fill="#2563eb"/>
  <text x="607" y="73" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#ffffff">新建订单</text>

  <!-- 筛选 -->
  <rect x="192" y="96" width="120" height="28" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="204" y="115" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#94a3b8">订单号</text>
  <rect x="324" y="96" width="104" height="28" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="336" y="115" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#94a3b8">状态</text>
  <rect x="440" y="96" width="104" height="28" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="452" y="115" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#94a3b8">日期</text>
  <rect x="556" y="96" width="56" height="28" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="575" y="115" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#1d4ed8">查询</text>

  <!-- 表头（7 列：勾选 + 6 数据列） -->
  <rect x="192" y="142" width="484" height="30" rx="4" fill="#f8fafc"/>
  <text x="216" y="162" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#64748b">订单号</text>
  <text x="286" y="162" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#64748b">客户</text>
  <text x="378" y="162" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#64748b" text-anchor="end">金额</text>
  <text x="394" y="162" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#64748b">时间</text>
  <text x="472" y="162" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#64748b">状态</text>
  <text x="536" y="162" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#64748b">操作</text>

  <!-- 行 1 -->
  <rect x="200" y="186" width="12" height="12" rx="3" fill="#2563eb"/>
  <text x="202" y="196" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="#ffffff">✓</text>
  <text x="216" y="196" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#1f2937">SO-1113-01</text>
  <text x="286" y="196" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#475569">张三</text>
  <text x="378" y="196" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#1f2937" text-anchor="end">¥499.00</text>
  <text x="394" y="196" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#475569">11-13 09:12</text>
  <rect x="472" y="182" width="54" height="20" rx="10" fill="#fffbeb"/>
  <text x="482" y="196" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#92400e">待发货</text>
  <text x="536" y="196" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#2563eb">查看</text>
  <text x="572" y="196" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#2563eb">发货</text>

  <!-- 行 2 -->
  <rect x="200" y="226" width="12" height="12" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="216" y="236" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#1f2937">SO-1112-14</text>
  <text x="286" y="236" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#475569">李四</text>
  <text x="378" y="236" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#1f2937" text-anchor="end">¥1,280.00</text>
  <text x="394" y="236" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#475569">11-12 17:40</text>
  <rect x="472" y="222" width="54" height="20" rx="10" fill="#ecfdf5"/>
  <text x="482" y="236" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#166534">已完成</text>
  <text x="536" y="236" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#2563eb">查看</text>

  <!-- 行 3 -->
  <rect x="200" y="266" width="12" height="12" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="216" y="276" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#1f2937">SO-1111-07</text>
  <text x="286" y="276" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#475569">王五</text>
  <text x="378" y="276" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#1f2937" text-anchor="end">¥86.00</text>
  <text x="394" y="276" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#475569">11-11 10:03</text>
  <rect x="472" y="262" width="54" height="20" rx="10" fill="#f1f5f9"/>
  <text x="482" y="276" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">已取消</text>
  <text x="536" y="276" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#2563eb">查看</text>

  <text x="192" y="330" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">列从 12 列收敛到 7 列（含勾选列），数字右对齐，状态用文字 + 浅色标签</text>
</svg>
