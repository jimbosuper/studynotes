<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320">
  <rect width="720" height="320" fill="#f8fafc"/>
  <text x="40" y="34" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#1f2937">视觉层级：先分组，再建立主次</text>

  <text x="40" y="64" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#64748b">调整前：所有元素一样重，间距拥挤</text>
  <rect x="40" y="78" width="280" height="200" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="56" y="94" width="248" height="28" rx="4" fill="#e5e7eb"/>
  <rect x="56" y="130" width="116" height="20" rx="4" fill="#e5e7eb"/>
  <rect x="180" y="130" width="124" height="20" rx="4" fill="#e5e7eb"/>
  <rect x="56" y="158" width="248" height="20" rx="4" fill="#e5e7eb"/>
  <rect x="56" y="186" width="248" height="20" rx="4" fill="#e5e7eb"/>
  <rect x="56" y="214" width="80" height="28" rx="4" fill="#cbd5e1"/>
  <rect x="144" y="214" width="80" height="28" rx="4" fill="#cbd5e1"/>

  <text x="380" y="64" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#64748b">调整后：标题、正文、操作分层，间距成组</text>
  <rect x="380" y="78" width="300" height="200" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="398" y="106" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="600" fill="#1f2937">订单详情</text>
  <rect x="398" y="120" width="80" height="6" rx="3" fill="#2563eb"/>
  <text x="398" y="150" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#64748b">基本信息</text>
  <rect x="398" y="160" width="120" height="10" rx="3" fill="#e2e8f0"/>
  <rect x="398" y="178" width="180" height="10" rx="3" fill="#e2e8f0"/>
  <text x="398" y="208" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#64748b">商品明细</text>
  <rect x="398" y="218" width="240" height="10" rx="3" fill="#e2e8f0"/>
  <rect x="398" y="236" width="200" height="10" rx="3" fill="#e2e8f0"/>
  <rect x="398" y="254" width="72" height="18" rx="4" fill="#2563eb"/>
  <text x="414" y="267" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#ffffff">提交</text>
