<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">
  <!-- 手机外框 -->
  <rect x="28" y="12" width="304" height="696" rx="48" fill="#ffffff" stroke="#d4dae3" stroke-width="2"/>
  <rect x="36" y="20" width="288" height="680" rx="40" fill="#f7fafc"/>
  <!-- 灵动岛 -->
  <rect x="140" y="34" width="80" height="24" rx="12" fill="#1f2933"/>
  <!-- 状态栏 -->
  <text x="64" y="50" font-size="13" fill="#1f2933" font-weight="600">9:41</text>
  <g fill="#1f2933">
    <rect x="248" y="38" width="3" height="8" rx="1"/>
    <rect x="253" y="35" width="3" height="11" rx="1"/>
    <rect x="258" y="32" width="3" height="14" rx="1"/>
    <rect x="263" y="29" width="3" height="17" rx="1"/>
    <rect x="270" y="28" width="22" height="11" rx="3" fill="none" stroke="#1f2933" stroke-width="1.5"/>
    <rect x="272" y="30" width="13" height="7" rx="1.5"/>
    <rect x="284" y="25" width="2" height="5"/>
  </g>
  <!-- 状态文字 -->
  <text x="180" y="160" font-size="15" fill="#6b7684" text-anchor="middle">专注中</text>
  <!-- 进度环 -->
  <circle cx="180" cy="320" r="92" fill="none" stroke="#e3e9f0" stroke-width="12"/>
  <!-- 进度弧：约 18% 完成 -->
  <circle cx="180" cy="320" r="92" fill="none" stroke="#0f9b8e" stroke-width="12"
          stroke-linecap="round" stroke-dasharray="104 578"
          transform="rotate(-90 180 320)"/>
  <!-- 剩余时间 -->
  <text x="180" y="332" font-size="46" font-weight="700" fill="#1f2933"
        text-anchor="middle" font-family="'SF Mono', Menlo, monospace">24:59</text>
  <text x="180" y="362" font-size="12" fill="#9aa4b2" text-anchor="middle">剩余时间</text>
  <!-- 今日统计卡片 -->
  <rect x="52" y="462" width="256" height="72" rx="18" fill="#ffffff" stroke="#e3e9f0"/>
  <text x="86" y="492" font-size="12" fill="#9aa4b2" text-anchor="middle">今日专注</text>
  <text x="86" y="516" font-size="20" font-weight="700" fill="#1f2933" text-anchor="middle">2 次</text>
  <line x1="138" y1="478" x2="138" y2="518" stroke="#edf1f5"/>
  <text x="184" y="492" font-size="12" fill="#9aa4b2" text-anchor="middle">累计时长</text>
  <text x="184" y="516" font-size="20" font-weight="700" fill="#1f2933" text-anchor="middle">50 分</text>
  <line x1="232" y1="478" x2="232" y2="518" stroke="#edf1f5"/>
  <text x="274" y="492" font-size="12" fill="#9aa4b2" text-anchor="middle">本轮</text>
  <text x="274" y="516" font-size="20" font-weight="700" fill="#1f2933" text-anchor="middle">25 分</text>
  <!-- 操作按钮 -->
  <rect x="58" y="560" width="150" height="52" rx="26" fill="#0f9b8e"/>
  <text x="133" y="593" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="600">暂停</text>
  <rect x="222" y="560" width="96" height="52" rx="26" fill="none" stroke="#0f9b8e" stroke-width="2"/>
  <text x="270" y="593" font-size="17" fill="#0f9b8e" text-anchor="middle" font-weight="600">重置</text>
  <!-- 底部提示 -->
  <text x="180" y="668" font-size="12" fill="#9aa4b2" text-anchor="middle">上次进度已恢复</text>
  <!-- Home 指示条 -->
  <rect x="140" y="684" width="80" height="5" rx="2.5" fill="#c3ccd8"/>
</svg>
