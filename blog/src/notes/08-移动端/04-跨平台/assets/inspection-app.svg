<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640">
  <rect width="360" height="640" fill="#f8fafc"/>
  <text x="16" y="24" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#94a3b8">巡检 App 效果（Flutter）</text>

  <!-- 手机外框 -->
  <rect x="30" y="44" width="300" height="560" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="130" y="56" width="100" height="8" rx="4" fill="#e2e8f0"/>

  <!-- 状态栏 -->
  <text x="52" y="88" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#475569">9:41</text>
  <rect x="252" y="80" width="20" height="8" rx="2" fill="#cbd5e1"/>
  <rect x="278" y="80" width="26" height="8" rx="2" fill="#cbd5e1"/>

  <!-- 顶栏 -->
  <text x="52" y="128" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="600" fill="#1f2937">今日巡检</text>
  <rect x="216" y="110" width="92" height="24" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="262" y="126" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#1e3a8a" text-anchor="middle">电量 87%</text>
  <line x1="52" y1="148" x2="308" y2="148" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 进度 -->
  <rect x="52" y="168" width="256" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="52" y="168" width="85" height="6" rx="3" fill="#2563eb"/>
  <text x="52" y="200" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#334155">1 / 3 已完成</text>

  <!-- 任务 1：未完成 -->
  <rect x="60" y="222" width="20" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="94" y="232" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#1f2937">机房：空调回风温度</text>
  <text x="94" y="252" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#94a3b8">待巡检</text>
  <line x1="60" y1="272" x2="300" y2="272" stroke="#f1f5f9" stroke-width="1"/>

  <!-- 任务 2：已完成 -->
  <rect x="60" y="286" width="20" height="20" rx="4" fill="#2563eb"/>
  <path d="M65 296 l4 4 l7 -8" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="94" y="296" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#94a3b8">冷库：门封密封性</text>
  <text x="94" y="316" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#16a34a">已完成</text>
  <line x1="60" y1="336" x2="300" y2="336" stroke="#f1f5f9" stroke-width="1"/>

  <!-- 任务 3：未完成 -->
  <rect x="60" y="350" width="20" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="94" y="360" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#1f2937">配电间：仪表读数拍照</text>
  <text x="94" y="380" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#94a3b8">待巡检</text>

  <!-- 底部操作 -->
  <rect x="52" y="492" width="256" height="46" rx="12" fill="#2563eb"/>
  <text x="180" y="520" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">提交今日巡检</text>
  <text x="180" y="562" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">离线保存 · 联网后自动同步</text>
</svg>
