  <rect x="64" y="408" width="76" height="40" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="102" y="433" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#1e3a8a" text-anchor="middle">10:30</text>
  <rect x="150" y="408" width="76" height="40" rx="8" fill="#ecfdf5" stroke="#86efac"/>
  <text x="188" y="433" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#166534" text-anchor="middle">14:00</text>
  <rect x="64" y="458" width="76" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="102" y="483" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">15:30</text>
  <rect x="150" y="458" width="76" height="40" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="188" y="483" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#1e3a8a" text-anchor="middle">18:00</text>

  <!-- 已选提示 -->
  <rect x="64" y="516" width="252" height="40" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="76" y="541" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#92400e">已选：今天 14:00 静安寺店 · 定金 50 元</text>

  <!-- 主按钮 -->
  <rect x="64" y="572" width="252" height="46" rx="12" fill="#2563eb"/>
  <text x="190" y="601" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">确认预约并支付定金</text>

  <!-- 底部 tabBar -->
  <line x1="40" y1="640" x2="340" y2="640" stroke="#e2e8f0"/>
  <text x="100" y="668" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle">首页</text>
  <text x="190" y="668" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">我的订单</text>
  <text x="280" y="668" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">我的</text>
</svg>
