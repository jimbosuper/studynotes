  <text x="93" y="352" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle">13</text>
  <rect x="130" y="308" width="58" height="56" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="159" y="330" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">周六</text>
  <text x="159" y="352" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#1f2937" text-anchor="middle">14</text>
  <rect x="196" y="308" width="58" height="56" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="225" y="330" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">周日</text>
  <text x="225" y="352" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#1f2937" text-anchor="middle">15</text>
  <rect x="262" y="308" width="54" height="56" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
