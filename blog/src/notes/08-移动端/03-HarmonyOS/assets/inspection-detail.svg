<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="photoFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DBEAFE"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <rect width="390" height="844" fill="#F1F3F6"/>

  <!-- 状态栏 -->
  <text x="28" y="31" font-size="15" font-weight="600" fill="#0F172A">9:41</text>
  <g fill="#0F172A">
    <rect x="296" y="23" width="3" height="7" rx="1"/>
    <rect x="302" y="20" width="3" height="10" rx="1"/>
    <rect x="308" y="17" width="3" height="13" rx="1"/>
    <rect x="314" y="14" width="3" height="16" rx="1"/>
    <path d="M330 20c4-4 10-4 14 0l-2 2c-3-3-7-3-10 0z" fill="#0F172A"/>
    <path d="M333 24c2-2 6-2 8 0l-2 2c-1-1-3-1-4 0z" fill="#0F172A"/>
    <rect x="352" y="15" width="22" height="11" rx="3" fill="none" stroke="#0F172A" stroke-opacity="0.5"/>
    <rect x="354" y="17" width="15" height="7" rx="1.5" fill="#0F172A"/>
    <rect x="375" y="18" width="2" height="5" rx="1" fill="#0F172A" fill-opacity="0.5"/>
  </g>

  <!-- 导航栏 -->
  <path d="M28 70l-7 7 7 7" fill="none" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="195" y="82" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">任务详情</text>
  <circle cx="356" cy="77" r="1.6" fill="#0F172A"/>
  <circle cx="363" cy="77" r="1.6" fill="#0F172A"/>
  <circle cx="370" cy="77" r="1.6" fill="#0F172A"/>

  <!-- 概要卡片 -->
  <rect x="20" y="102" width="350" height="156" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="36" y="120" width="54" height="20" rx="10" fill="#FEF3C7"/>
  <text x="63" y="134" font-size="10" font-weight="500" fill="#92400E" text-anchor="middle">待巡检</text>
  <text x="354" y="134" font-size="11" fill="#94A3B8" text-anchor="end">T-1001</text>

  <text x="36" y="172" font-size="22" font-weight="700" fill="#0F172A">检查 3 号消防通道</text>

  <text x="36" y="203" font-size="10" fill="#94A3B8">区域</text>
  <text x="36" y="222" font-size="13" fill="#334155">A 区 · 1F</text>
  <text x="150" y="203" font-size="10" fill="#94A3B8">截止</text>
  <text x="150" y="222" font-size="13" fill="#334155">10:30</text>
  <text x="250" y="203" font-size="10" fill="#94A3B8">类型</text>
  <text x="250" y="222" font-size="13" fill="#334155">消防设施</text>

  <!-- 巡检记录 -->
  <text x="22" y="286" font-size="13" font-weight="500" fill="#475569">巡检记录</text>
  <rect x="20" y="298" width="350" height="176" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <text x="36" y="326" font-size="13" fill="#334155">泵房压力 0.42 MPa，运行正常。</text>
  <text x="36" y="348" font-size="13" fill="#334155">2 号阀门有轻微渗水，已拍照并</text>
  <text x="36" y="370" font-size="13" fill="#334155">通知维修班组。</text>
  <text x="354" y="456" font-size="10" fill="#94A3B8" text-anchor="end">38/200</text>
  <line x1="36" y1="438" x2="354" y2="438" stroke="#F1F5F9" stroke-width="1"/>

  <!-- 现场照片 -->
  <text x="22" y="504" font-size="13" font-weight="500" fill="#475569">现场照片</text>
  <rect x="20" y="516" width="168" height="100" rx="12" fill="url(#photoFill)"/>
  <circle cx="62" cy="550" r="9" fill="#FFFFFF" fill-opacity="0.85"/>
  <path d="M34 606l38-30 28 22 22-16 32 24v10H34z" fill="#94A3B8" fill-opacity="0.35"/>
  <text x="32" y="534" font-size="10" fill="#475569">2 号泵房压力表</text>

  <rect x="200" y="516" width="170" height="100" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <path d="M285 552v20M275 562h20" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round"/>
  <text x="285" y="594" font-size="11" fill="#94A3B8" text-anchor="middle">拍照或从相册选择</text>

  <!-- 完成状态 -->
  <rect x="20" y="640" width="350" height="68" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <text x="36" y="668" font-size="14" fill="#334155">完成状态</text>
  <text x="36" y="688" font-size="11" fill="#94A3B8">打开后计入今日进度</text>
  <rect x="316" y="660" width="42" height="24" rx="12" fill="#E2E8F0"/>
  <circle cx="328" cy="672" r="9" fill="#FFFFFF"/>
  <circle cx="328" cy="672" r="9" fill="none" stroke="#CBD5E1" stroke-width="0.8"/>

  <!-- 保存按钮 -->
  <rect x="20" y="748" width="350" height="48" rx="24" fill="#2563EB"/>
  <text x="195" y="778" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">保存记录</text>

  <rect x="145" y="830" width="100" height="4" rx="2" fill="#0F172A" opacity="0.8"/>
</svg>
